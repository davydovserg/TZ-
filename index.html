<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ТЗ из коробки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: шапка + степпер сверху, рабочая область слева, живая смета справа (на телефоне — нижняя панель) */
:root{
  --bg:#ECEEED; --surface:#FFFFFF; --surface-2:#F4F5F4; --ink:#1B2025; --muted:#5D6770; --line:#D3D8D7;
  --accent:#2C5AA0; --accent-ink:#FFFFFF; --accent-soft:#E2E9F5;
  --ok:#2B7A4B; --ok-soft:#E1F1E7; --warn:#9A6200; --warn-soft:#FBF0DA; --bad:#B3261E; --bad-soft:#FBE4E2;
  --plan-bg:#F7F8F7; --plan-room:#FFFFFF; --plan-wall:#2A3036; --plan-item:#E2E9F5; --plan-grid:#E6E9E8;
  --viz-bg:#E4E7E6;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181C; --surface:#1D2227; --surface-2:#242A30; --ink:#E5E8EA; --muted:#98A2AB; --line:#323A42;
  --accent:#86A9E6; --accent-ink:#0F1A2C; --accent-soft:#223149;
  --ok:#62BD86; --ok-soft:#1B3326; --warn:#E2AB45; --warn-soft:#3A2E17; --bad:#F2786E; --bad-soft:#3E1F1D;
  --plan-bg:#181C20; --plan-room:#20262B; --plan-wall:#C9D0D6; --plan-item:#223149; --plan-grid:#262C32;
  --viz-bg:#20252A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181C; --surface:#1D2227; --surface-2:#242A30; --ink:#E5E8EA; --muted:#98A2AB; --line:#323A42;
  --accent:#86A9E6; --accent-ink:#0F1A2C; --accent-soft:#223149;
  --ok:#62BD86; --ok-soft:#1B3326; --warn:#E2AB45; --warn-soft:#3A2E17; --bad:#F2786E; --bad-soft:#3E1F1D;
  --plan-bg:#181C20; --plan-room:#20262B; --plan-wall:#C9D0D6; --plan-item:#223149; --plan-grid:#262C32;
  --viz-bg:#20252A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px} h3{font-size:14px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} small{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:16px;font-weight:600}
.brand .mark{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--ink);border-radius:4px;font-family:var(--f-mono);font-size:11px;font-weight:500;align-self:center}
.proj{color:var(--muted);font-size:13px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.draft{background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.steps{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;border:0;background:none;padding:9px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);display:flex;gap:7px;align-items:center;font-weight:500}
.step .n{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.step[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.step:hover{color:var(--ink)}
.step .lock{font-size:11px}

/* layout */
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;padding-block:18px 40px;max-width:1360px;margin:0 auto}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h .idx{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lead{color:var(--muted);margin:4px 0 0;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea,.inp{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
.field textarea{resize:vertical;min-height:64px}
.field input[type=number],.inp[type=number]{font-family:var(--f-mono)}
.vmsg{font-size:12px;min-height:0}
.vmsg.bad{color:var(--bad)} .vmsg.warn{color:var(--warn)}
.inp.bad,.field input.bad{border-color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 11px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:var(--surface-2);font-size:13px}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface-2);cursor:pointer;font-size:13px}
.chip input{accent-color:var(--accent);margin:0}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{padding:11px 16px;font-size:15px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.room{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.room .top{display:flex;gap:8px;align-items:center}
.room .top input{font-weight:600}
.room .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.room .area{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.room .field input,.room .field select{background:var(--surface)}
.comms{display:flex;gap:6px;flex-wrap:wrap}
.zone{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.zone:first-of-type{border-top:0}
.zone h3{font-size:13px;padding-top:5px}

/* files */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.fname{display:flex;gap:10px;align-items:center;min-width:180px}
.thumb{width:40px;height:40px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--muted);overflow:hidden;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover}
.st{font-size:12px;font-weight:500}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)} .st.proc{color:var(--accent)}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:4px;width:120px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.recog{border:1px solid var(--accent);background:var(--accent-soft);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px}
.recog .inp{width:80px;background:var(--surface)}

/* plan */
.plan-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:16px;align-items:start}
.plan-svg{width:100%;height:auto;display:block;background:var(--plan-bg);border-radius:8px}
.plan-svg .room-r{fill:var(--plan-room);stroke:var(--plan-wall);stroke-width:7}
.plan-svg .room-r.sel{fill:var(--accent-soft)}
.plan-svg .it{fill:var(--plan-item);stroke:var(--accent);stroke-width:2;cursor:pointer}
.plan-svg .it:hover,.plan-svg .it.pick{stroke-width:5}
.plan-svg .it.bad{stroke:var(--bad);fill:var(--bad-soft)}
.plan-svg text{fill:var(--ink);font-family:var(--f-body)}
.plan-svg .lbl{font-size:24px;font-weight:600}
.plan-svg .sub{font-size:18px;fill:var(--muted);font-family:var(--f-mono)}
.plan-svg .itl{font-size:14px;pointer-events:none}
.plan-svg .dim{font-size:16px;fill:var(--muted);font-family:var(--f-mono)}
.plan-svg .win{stroke:var(--accent);stroke-width:9}
.plan-svg .door{stroke:var(--plan-room);stroke-width:9}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.side-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.item .nm{font-weight:500}
.item .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item .pr{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.item.bad .nm{color:var(--bad)}
.alts{grid-column:1/-1;margin-top:8px;border:1px solid var(--accent);border-radius:8px;overflow:hidden}
.alts .hd{padding:8px 10px;background:var(--accent-soft);font-size:12px}
.alt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left;border-left:0;border-right:0;border-bottom:0;width:100%}
.alt:hover{background:var(--surface-2)}
.alt[aria-disabled="true"]{cursor:not-allowed;opacity:.62}
.alt .why{grid-column:1/-1;font-size:12px}
.alt .why.bad{color:var(--bad)} .alt .why.ok{color:var(--ok)}
.alt.cur{box-shadow:inset 3px 0 0 var(--accent)}
.delta{font-family:var(--f-mono);font-size:12px}
.delta.up{color:var(--bad)} .delta.dn{color:var(--ok)}
.check{display:flex;flex-direction:column;gap:2px}
.ck{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:6px 0}
.ck b{font-weight:500}
.ck .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.ck.ok .ic{background:var(--ok-soft);color:var(--ok)}
.ck.bad .ic{background:var(--bad-soft);color:var(--bad)}
.ck.warn .ic{background:var(--warn-soft);color:var(--warn)}
.ck small{display:block;color:var(--muted)}
.ask{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ask:last-child{border-bottom:0}
.ask p{margin:0;flex:1}

/* viz */
.viz-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.canvas-wrap{position:relative;border-radius:8px;overflow:hidden;background:var(--viz-bg);aspect-ratio:16/10;max-width:100%}
.canvas-wrap canvas{width:100%;height:100%;display:block}
.render-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--viz-bg) 82%,transparent);font-size:13px}
.render-ov .bar{width:200px}
figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.swatches{display:flex;flex-direction:column;gap:6px}
.sw{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw i{width:28px;height:28px;border-radius:5px;border:1px solid var(--line)}
.total-big{font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:-.02em}
.confirm-box{display:flex;flex-direction:column;gap:10px}
.banner{border-radius:9px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.info{background:var(--accent-soft);color:var(--ink)}

/* smeta */
.sum-row td{font-weight:600}
.grp td{background:var(--surface-2);font-weight:600;font-size:13px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tot{border:1px solid var(--line);border-radius:9px;padding:12px}
.tot .k{font-size:12px;color:var(--muted)}
.tot .v{font-family:var(--f-mono);font-size:18px;margin-top:2px}
.tot.main{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tot.main .k{color:inherit;opacity:.7}

/* tz */
.lockcard{text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.lockcard .ic{font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--muted);border-radius:6px;padding:6px 10px;color:var(--muted)}
.sheet{background:#FFFFFF;color:#1B2025;border-radius:4px;padding:36px 40px;box-shadow:0 1px 0 var(--line),0 8px 30px rgba(0,0,0,.08);max-width:860px;margin:0 auto;width:100%}
.sheet h1{font-size:22px;margin-bottom:6px}
.sheet h2{font-size:15px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1.5px solid #1B2025}
.sheet table th,.sheet table td{border-bottom:1px solid #DADFDE;font-size:12.5px;padding:6px}
.sheet th{color:#5D6770}
.sheet .title-pg{border:1.5px solid #1B2025;padding:22px;display:grid;gap:4px}
.sheet .kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:4px 12px;font-size:13px}
.sheet .kv span:nth-child(odd){color:#5D6770}
.sheet .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sheet .imgs canvas{width:100%;aspect-ratio:16/10;background:#E4E7E6;border-radius:4px}
.sheet .imgs div{font-size:11px;color:#5D6770}
.sheet .plan-svg{background:#F7F8F7}
.sheet .plan-svg .room-r{fill:#fff;stroke:#2A3036}
.sheet .plan-svg .it{fill:#E2E9F5;stroke:#2C5AA0}
.sheet .plan-svg text{fill:#1B2025}
.sheet .plan-svg .sub,.sheet .plan-svg .dim{fill:#5D6770}
.sheet .plan-svg .door{stroke:#fff}
.code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:12px;max-height:340px;overflow:auto;white-space:pre;margin:0}

/* cost aside */
aside.cost{position:sticky;top:calc(env(safe-area-inset-top,0px) + 106px);align-self:start;display:flex;flex-direction:column;gap:12px}
.cost .card{padding:14px}
.cost h2{font-size:13px;font-weight:500;color:var(--muted);font-family:var(--f-body);text-transform:uppercase;letter-spacing:.07em}
.cline{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.cline:last-of-type{border-bottom:0}
.cline .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.cost .grand{margin-top:8px;padding-top:10px;border-top:1.5px solid var(--ink)}
.cost .grand .total-big{font-size:22px}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meter.budget i{background:var(--ok)}
.meter.budget.over i{background:var(--bad)}
.flash{animation:fl .7s ease}
@keyframes fl{from{background:var(--accent-soft)}to{background:transparent}}
.mob-cost{display:none}

@media (max-width:1080px){
  .plan-layout,.viz-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:90px}
  aside.cost{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:8;gap:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:70vh;overflow:auto}
  aside.cost .card{border:0;padding:8px 0;background:none}
  aside.cost:not(.open) .card{display:none}
  .mob-cost{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left}
  .mob-cost .total-big{font-size:18px}
  .zone{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:20px 16px}
  .sheet .kv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="hbar">
      <div class="brand"><span class="mark">ТЗ</span><h1>ТЗ из коробки</h1></div>
      <span class="proj" id="projName">Квартира 87 · монолит, 62 м² · пример</span>
      <span class="spacer"></span>
      <span id="statusPill" class="pill draft">Черновик</span>
      <button class="btn ghost sm" id="resetBtn" type="button">Сбросить к примеру</button>
    </div>
    <nav class="steps" id="steps" aria-label="Этапы"></nav>
  </div>
</header>

<div class="wrap">
  <div class="app">

/* ===================== Раскладка комнаты ===================== */
function wallFor(type,slot){
  if(type==='kitchen'){
    if(slot==='dining')return'center'; if(slot==='hood')return'none';
    const L={linear:{},corner:{dw:'left',hob:'left'},u:{storage:'left',hob:'right'}}[S.klay]||{};
    return L[slot]||'top';
  }
  return({living:{sofa:'bottom',tv:'top',storage:'top',table:'center'},
    bedroom:{bed:'top',wardrobe:'left',desk:'bottom'},
    bath:{tub:'top',basin:'left',washer:'left',cab:'left',toilet:'right'},
    hall:{hw:'left',bench:'left'}}[type]||{})[slot]||'top';
}
function layout(r,override){
  const W=r.w*100,L=r.l*100,items=[];
  (SLOTS[r.type]||[]).forEach(([slot,label])=>{
    if(!isOn(r,slot))return;
    const i=override&&override.slot===slot?override.i:selIdx(r,slot);
    const o=optObj(r.type,slot,i);
    items.push(Object.assign(o,{slot,label,i,wall:o.w>0?wallFor(r.type,slot):'none'}));
  });
  const on=w=>items.filter(i=>i.wall===w);
  const md=a=>a.reduce((m,i)=>Math.max(m,i.d),0);
  const tD=md(on('top')),bD=md(on('bottom')),lD=md(on('left')),rD=md(on('right'));
  const free={},issues=[];
  const place=(wall,start,end)=>{
    const list=on(wall);if(!list.length)return;
    const len=end-start,used=list.reduce((s,i)=>s+i.w,0);free[wall]=len-used;
    let pos=start;
    if(r.type==='bedroom'&&wall==='top')pos=start+(len-used)/2;
    if(r.type==='bedroom'&&wall==='bottom')pos=end-used;
    list.forEach(it=>{
      if(wall==='top')Object.assign(it,{x:pos,y:0,rw:it.w,rh:it.d});
      if(wall==='bottom')Object.assign(it,{x:pos,y:L-it.d,rw:it.w,rh:it.d});
      if(wall==='left')Object.assign(it,{x:0,y:pos,rw:it.d,rh:it.w});
      if(wall==='right')Object.assign(it,{x:W-it.d,y:pos,rw:it.d,rh:it.w});
      it.free=len-used;pos+=it.w;
    });
    if(used>len){list.forEach(it=>it.bad=true);issues.push({slot:list[list.length-1].slot,msg:`${r.name}: на стене не хватает ${Math.round(used-len)} см`})}
  };
  place('top',0,W);place('bottom',0,W);place('left',tD,L-bD);place('right',tD,L-bD);
  const fW=W-lD-rD,fL=L-tD-bD,need=CLEAR[r.type]||80;
  const hasH=lD||rD,hasV=tD||bD;
  if(hasH&&fW<need)issues.push({slot:(on('left')[0]||on('right')[0]).slot,msg:`${r.name}: проход между рядами ${Math.round(fW)} см, нужно от ${need}`});
  if(hasV&&fL<need)issues.push({slot:(on('bottom')[0]||on('top')[0]).slot,msg:`${r.name}: проход ${Math.round(fL)} см, нужно от ${need}`});
  on('center').forEach(it=>{
    const pw=it.slot==='dining'?60:0,pl=it.slot==='dining'?110:80;
    Object.assign(it,{x:lD+(fW-it.w)/2,y:tD+(fL-it.d)/2,rw:it.w,rh:it.d});
    if(fW<it.w+pw||fL<it.d+pl){it.bad=true;issues.push({slot:it.slot,msg:`${r.name}: ${it.label.toLowerCase()} не помещается со свободным обходом`})}
  });
  if(r.type==='bedroom'){const b=on('top').find(i=>i.slot==='bed');if(b){const g=(W-b.w)/2;if(g<55){b.bad=true;issues.push({slot:'bed',msg:`${r.name}: подход к кровати ${Math.round(g)} см, нужно от 55`})}}}
  if(r.type==='living'){const tv=on('top').find(i=>i.slot==='tv'),so=on('bottom').find(i=>i.slot==='sofa');if(tv&&so&&fL<200){issues.push({slot:'sofa',msg:`${r.name}: до ТВ ${Math.round(fL)} см, комфортно от 200`})}}
  issues.forEach(is=>{const it=items.find(i=>i.slot===is.slot);if(it)it.bad=true});
  return{W,L,items,issues,free,fW,fL,tD,bD,lD,rD};
}
function kitchenRun(lay){return lay.items.filter(i=>i.wall!=='none'&&i.wall!=='center'&&!['fridge','oven'].includes(i.slot)).reduce((s,i)=>s+i.w,0)}

function compute(){

  });
  const furn=spec.reduce((s,i)=>s+i.p,0);
  const W=[];const grp=(zone,rows)=>{rows=rows.filter(x=>x&&x.q>0);if(rows.length)W.push({zone,rows})};

  if(cap)grp('Черновые работы',[{n:'Стяжка пола',q:floorA,u:'м²',p:950},{n:'Штукатурка стен по маякам',q:wallA,u:'м²',p:780}]);
  grp('Электрика',cap?[{n:'Электромонтаж, точки',q:points,u:'шт.',p:1900},{n:'Сборка электрощита',q:1,u:'шт.',p:28000},{n:'Монтаж светильников',q:spots,u:'шт.',p:650}]:[{n:'Замена розеток и выключателей',q:points,u:'шт.',p:350},{n:'Монтаж светильников',q:spots,u:'шт.',p:650}]);
  grp('Сантехника',cap?[{n:'Разводка водоснабжения и канализации',q:1,u:'компл.',p:24000},{n:'Подключение приборов',q:wet,u:'шт.',p:7500}]:[{n:'Установка приборов',q:wet,u:'шт.',p:3500}]);
  const fr=[];['wall','floor','ceil'].forEach(g=>Object.entries(agg[g]).forEach(([key,q])=>fr.push({n:({wall:'Стены',floor:'Пол',ceil:'Потолок'})[g]+': '+FIN[g][key].n.toLowerCase(),q,u:'м²',p:FIN[g][key].w})));
  grp('Отделка',fr);
  grp('Двери',[{n:'Установка межкомнатных дверей',q:doors,u:'шт.',p:6500}]);
  let works=W.reduce((s,g)=>s+g.rows.reduce((a,x)=>a+x.q*x.p,0),0);
  if(o.works==='turnkey'){const t=[{n:'Сборка и установка мебели',q:1,u:'компл.',p:furn*.06},{n:'Финальный клининг',q:o.area||floorA,u:'м²',p:250},{n:'Управление проектом и закупками',q:1,u:'компл.',p:works*.07}];grp('Под ключ',t);works+=t.reduce((s,x)=>s+x.q*x.p,0)}
  W.forEach(g=>g.sum=g.rows.reduce((a,x)=>a+x.q*x.p,0));
  const M=[];
  ['wall','floor','ceil'].forEach(g=>Object.entries(agg[g]).forEach(([key,q])=>M.push({n:FIN[g][key].n+' — материал, класс «'+CLS[o.cls].n.toLowerCase()+'»',q,u:'м²',p:FIN[g][key].m*k})));
  if(cap){M.push({n:'Черновые смеси (стяжка, штукатурка)',q:floorA,u:'м²',p:480+wallA/floorA*300});M.push({n:'Кабель, щит, автоматика',q:1,u:'компл.',p:22000+points*850});M.push({n:'Трубы, фитинги, коллектор',q:1,u:'компл.',p:32000+wet*2600})}
  M.push({n:'Межкомнатные двери с фурнитурой',q:doors,u:'шт.',p:CLS[o.cls].door});

  const mat=M.reduce((s,x)=>s+x.q*x.p,0);

function completeness(){

  parts.push(['Размеры всех помещений',S.rooms.length&&S.rooms.every(roomOk)?1:0,.2]);
  const drawing=S.files.some(f=>f.status==='ok'&&DRAW.includes(f.ext)&&f.recog==='applied');
  parts.push(['Чертёж с распознанными размерами',drawing?1:0,.25]);
  const wetR=S.rooms.filter(r=>['kitchen','bath'].includes(r.type));
  const ph=wetR.filter(r=>S.files.some(f=>f.status==='ok'&&f.room===r.id&&!DRAW.includes(f.ext))).length;
  parts.push(['Фото мокрых зон',wetR.length?ph/wetR.length:1,.15]);
  parts.push(['Ограничения',(Object.values(S.keep).some(Boolean)||S.avoid.trim())?1:0,.1]);
  parts.push(['Стиль и бюджет',o.style&&o.budgetMax>0?1:0,.1]);
  return{v:parts.reduce((s,p)=>s+p[1]*p[2],0),parts};
}

/* ===================== Проверки ===================== */
function validate(){
  const o=S.object,v={},g=[];
  const rng=(key,val,min,max,soft)=>{if(val==null||isNaN(val))v[key]={l:'bad',m:'Заполните поле'};else if(val<min||val>max)v[key]={l:'bad',m:`Допустимо ${dec(min)}–${dec(max)}`};else if(soft&&(val<soft[0]||val>soft[1]))v[key]={l:'warn',m:soft[2]}};
  rng('o:area',o.area,15,500,[25,300,'Нетипичная площадь — проверьте']);
  rng('o:height',o.height,2.4,4.5,[2.5,3.6,'Нетипично для монолита — проверьте по чертежу']);
  rng('o:people',o.people,1,12);
  if(o.budgetMin>o.budgetMax)v['o:budgetMax']={l:'bad',m:'Верхняя граница меньше нижней'};
  S.rooms.forEach(r=>{
    rng('r:'+r.id+':w',r.w,.8,15,[1.2,9,'Проверьте размер']);rng('r:'+r.id+':l',r.l,.8,15,[1.2,9,'Проверьте размер']);
  });
  const sum=S.rooms.filter(roomOk).reduce((s,r)=>s+r.w*r.l,0);
  if(o.area>0&&sum>0){const d=(sum-o.area)/o.area;if(d>0.02)g.push({l:'bad',m:`Сумма площадей помещений (${m2(sum)}) больше площади объекта (${m2(o.area)})`});else if(d<-0.15)g.push({l:'warn',m:`Помещения покрывают ${Math.round(sum/o.area*100)}% площади. Добавьте коридор, лоджию или кладовую`})}
  return{v,g,sum};
}
function practical(c){
  const out=[],K=S.rooms.find(r=>r.type==='kitchen'),B=S.rooms.find(r=>r.type==='bath');
  const iss=Object.values(c.lays).flatMap(l=>l.issues);
  const has=(r,slot)=>r&&c.lays[r.id]&&c.lays[r.id].items.some(i=>i.slot===slot);
  const badSlot=(r,slot)=>r&&c.lays[r.id]&&c.lays[r.id].items.some(i=>i.slot===slot&&i.bad);
  if(K){
    out.push({k:'Место для холодильника',s:has(K,'fridge')?(badSlot(K,'fridge')?'bad':'ok'):'bad',d:has(K,'fridge')?optObj('kitchen','fridge',selIdx(K,'fridge')).n:'Холодильник не запланирован'});
    out.push({k:'Мойка',s:has(K,'sink')?(K.pl?'ok':'bad'):'bad',d:!has(K,'sink')?'Мойка не запланирована':K.pl?'Подвод воды отмечен':'Нет сантехники в кухне — уточните стояк'});
    out.push({k:'Варочная панель и вытяжка',s:has(K,'hob')&&has(K,'hood')?(K.ve?'ok':'warn'):'bad',d:!has(K,'hob')?'Варочная не выбрана':!has(K,'hood')?'Нет вытяжки над варочной':K.ve?'Вентканал есть':'Вентканал не отмечен — только рециркуляция'});
    const L=c.lays[K.id],closed=L?L.items.filter(i=>['storage','sink','dw','hob'].includes(i.slot)).reduce((s,i)=>s+i.w,0):0;
    out.push({k:'Закрытые шкафы на кухне',s:has(K,'storage')&&closed>=180?'ok':has(K,'storage')?'warn':'bad',d:`Закрытых нижних модулей ${closed} см, рекомендуем от 180`});
  }
  if(B&&has(B,'washer'))out.push({k:'Стиральная машина у коммуникаций',s:B.pl?'ok':'bad',d:B.pl?'Санузел с подводом воды':'В санузле не отмечена сантехника'});
  const pass=iss.filter(i=>/проход|подход|обход/.test(i.msg));
  out.push({k:'Свободные проходы',s:pass.length?'bad':'ok',d:pass.length?pass.map(i=>i.msg).join('; '):'Во всех помещениях проходы в норме'});
  const fit=iss.filter(i=>/не хватает|не помещается|до ТВ/.test(i.msg));
  if(fit.length)out.push({k:'Габариты',s:'bad',d:fit.map(i=>i.msg).join('; ')});
  const store=S.rooms.reduce((s,r)=>{const l=c.lays[r.id];return s+(l?l.items.filter(i=>['wardrobe','hw','storage'].includes(i.slot)&&r.type!=='kitchen').reduce((a,i)=>a+i.w,0):0)},0);
  const need=(S.object.people||1)*80;
  out.push({k:'Достаточно ли хранения',s:store>=need?'ok':'warn',d:`Шкафов и стеллажей ${store} см на ${S.object.people||1} чел., норма от ${need} см`});
  const bmax=S.object.budgetMax*1e6;
  out.push({k:'Укладывается в бюджет',s:c.total<=bmax?'ok':'warn',d:c.total<=bmax?`Запас ${mln(bmax-c.total)}`:`Превышение на ${mln(c.total-bmax)}. Попробуйте класс «Эконом» или фасады ЛДСП`});
  return out;
}
function clarifications(){
  const a=[];
  if(!S.files.some(f=>DRAW.includes(f.ext)&&f.status==='ok'))a.push({m:'Нет чертежа. Загрузите планировку застройщика или обмерный план (PDF, DWG, DXF), иначе размеры остаются ручными.',go:'files'});
  S.rooms.filter(r=>['kitchen','bath'].includes(r.type)).forEach(r=>{if(!S.files.some(f=>f.room===r.id&&f.status==='ok'&&!DRAW.includes(f.ext)))a.push({m:`${r.name}: добавьте фото стояков и вентканала, чтобы привязать сантехнику.`,go:'files'})});
  S.rooms.filter(r=>r.type==='bedroom'&&!r.win).forEach(r=>a.push({m:`${r.name} без окна? Проверьте анкету.`,go:'form'}));
  const K=S.rooms.find(r=>r.type==='kitchen');if(K&&!K.ve)a.push({m:'Кухня: есть ли вентканал для вытяжки? Без него только рециркуляция.',go:'form'});

  return a;
}

async function handleFiles(list){
  for(const file of list){
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    const f={id:'f'+Date.now()+Math.random().toString(36).slice(2,6),name:file.name,ext,size:file.size,room:guessRoom(file.name),status:'proc',note:'Проверяем файл…',prog:20};
    S.files.push(f);
    if(!ACCEPT.includes(ext)){Object.assign(f,{status:'bad',note:`Формат .${ext} не поддерживается`});continue}
    if(file.size===0){Object.assign(f,{status:'bad',note:'Пустой файл'});continue}
    if(file.size>MAXMB*1048576){Object.assign(f,{status:'bad',note:`Больше ${MAXMB} МБ`});continue}
    const head=new Uint8Array(await file.slice(0,2048).arrayBuffer());
    const txt=String.fromCharCode(...head.slice(0,2048));
    const okSig={jpg:head[0]===0xFF&&head[1]===0xD8,jpeg:head[0]===0xFF&&head[1]===0xD8,png:head[0]===0x89&&txt.slice(1,4)==='PNG',pdf:txt.startsWith('%PDF'),dwg:txt.startsWith('AC10'),dxf:/SECTION/.test(txt),heic:txt.slice(4,8)==='ftyp'}[ext];
    if(!okSig){Object.assign(f,{status:'bad',note:'Файл повреждён или не соответствует расширению'});continue}
    if(['jpg','jpeg','png'].includes(ext)){
      const url=URL.createObjectURL(file);
      const dims=await new Promise(res=>{const im=new Image();im.onload=()=>res([im.naturalWidth,im.naturalHeight]);im.onerror=()=>res(null);im.src=url});
      if(!dims){Object.assign(f,{status:'bad',note:'Изображение не читается'});continue}
      BLOBS[f.id]=url;
      Object.assign(f,{status:dims[0]<800?'bad':'ok',note:dims[0]<800?`Слишком мелкое фото (${dims[0]}×${dims[1]}), нужно от 800 px`:`Фото читается, ${dims[0]}×${dims[1]}`});
    }else if(ext==='heic'){Object.assign(f,{status:'ok',note:'HEIC принят, конвертация на сервере'})}

  }
  changed();
}

/* ===================== События ===================== */
function setBind(key,el){
  let v=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?null:parseFloat(el.value)):el.value;
  const [kind,a,b]=key.split(':');
  if(kind==='o')S.object[a]=v;
  else if(kind==='r'){const r=S.rooms.find(x=>x.id===a);if(r){if(['win','doors'].includes(b))v=Math.max(0,Math.round(v||0));r[b]=v}}
  else if(kind==='q')S.req[a]=v;
  else if(kind==='k')S.keep[a]=v;
  else if(key==='avoid')S.avoid=v;
  else if(key==='klay')S.klay=v;
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.b&&(el.type==='number'||el.type==='text'||el.tagName==='TEXTAREA')){setBind(el.dataset.b,el);refresh()}
  if(el.dataset.det){const [fid,i,k]=el.dataset.det.split(':');const f=S.files.find(x=>x.id===fid);if(f)f.det[+i][k]=parseFloat(el.value);save()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.b){setBind(el.dataset.b,el);if(el.dataset.b.endsWith(':type')){const r=S.rooms.find(x=>'r:'+x.id+':type'===el.dataset.b);if(r&&Object.values(TYPES).includes(r.name))r.name=TYPES[r.type]}changed()}
  if(el.dataset.froom){const f=S.files.find(x=>x.id===el.dataset.froom);f.room=el.value;changed()}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-pick],[data-room]');if(!t)return;
  const d=t.dataset;
  if(d.step){S.ui.step=d.step;S.ui.pick=null;render();window.scrollTo({top:0});return}
  if(t.id==='mobToggle'){S.ui.mobOpen=!S.ui.mobOpen;renderCost();return}
  if(d.proom){S.ui.planRoom=d.proom;S.ui.pick=null;render();return}

  if(d.pick||d.pickbtn){const [rid,slot]=(d.pick||d.pickbtn).split('|');const same=S.ui.pick&&S.ui.pick.rid===rid&&S.ui.pick.slot===slot;S.ui.planRoom=rid;S.ui.pick=same&&d.pickbtn?null:{rid,slot};render();return}
  if(d.alt){if(t.getAttribute('aria-disabled')==='true')return;const [rid,slot,i]=d.alt.split('|');S.sel[rid+'.'+slot]=+i;changed();return}
  if(d.vroom){S.ui.vizRoom=d.vroom;render();return}

  if(d.klay){S.klay=d.klay;changed();return}

  switch(d.act){
    case'addRoom':{const type=$('#newType').value;S.rooms.push({id:'r'+Date.now(),type,name:TYPES[type],w:3,l:3,win:type==='bath'||type==='hall'?0:1,doors:1,el:true,pl:['kitchen','bath'].includes(type),ve:['kitchen','bath'].includes(type),wall:type==='bath'?'tile':'paint',floor:type==='bath'?'tile':'laminate',ceil:'stretch'});changed();break}

    case'confirm':S.confirmed={sig:sig(),at:new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),total:C.total};FLASH='';render();break;
    case'pdf':$('#pdfNote').textContent='В рабочей версии PDF собирается на сервере из этого же документа. В прототипе — предпросмотр ниже и JSON/XML.';break;
    case'copy':{const txt=$('#code').textContent;navigator.clipboard.writeText(txt).then(()=>{t.textContent='Скопировано'},()=>{const r=document.createRange();r.selectNodeContents($('#code'));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='Выделено, нажмите Ctrl+C'});break}
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.pick){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#resetBtn').addEventListener('click',()=>{Object.values(BLOBS).forEach(u=>URL.revokeObjectURL(u));S=defaults();FLASH='';render()});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const cv=$('#viz');if(cv&&$('#ov').hidden)drawViz(cv,S.rooms.find(r=>r.id===S.ui.vizRoom),getComputedStyle(document.documentElement).getPropertyValue('--viz-bg').trim())},200)});
render();
</script>
